<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Accesso · Papa Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="login">
  <form class="card" method="post" autocomplete="on">
    <div class="logo">Papa</div>
    <div class="sub">Design Studio · Finanze</div>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="f"><label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="f"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
    <button class="btn primary" type="submit">Accedi</button>
  </form>
</main>
</body>
</html>
