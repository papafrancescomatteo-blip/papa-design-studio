<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0d10">
<title>Gestione sito · Papa Design Studio</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="grain" data-csrf="{{ csrf }}">
<header class="top"><div class="wrap">
  <a class="brand" href="/app" aria-label="Papa Design Studio"><img src="{{ url_for('static', filename='logo.png') }}" alt="Papa Design Studio"></a>
  <a class="btn small ghost" href="/app">← Note spese</a>
  <a class="btn small" href="/" target="_blank" rel="noopener">Vedi la home ↗</a>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn ghost small" type="submit">Esci</button></form>
</div></header>

<main class="wrap">
  <div class="hero" style="margin-top:34px">
    <p class="hello" style="font-size:clamp(30px,4vw,46px)">Gestione del sito</p>
    <p class="muted">Aggiungi o modifica prodotti, riviste, premi e tappe della storia: la home pubblica si aggiorna subito.</p>
  </div>

  <nav class="tabs" id="tabs">
    <button data-t="catalog" class="on">Prodotti</button>
    <button data-t="news">Riviste e Cersaie</button>
    <button data-t="award">Premi</button>
    <button data-t="timeline">Percorso</button>
    <button data-t="portrait">Ritratto</button>
  </nav>

  <section id="panel"></section>
</main>

<div id="modalRoot"></div>
<script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
